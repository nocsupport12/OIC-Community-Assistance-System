<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Police Incident Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-100 via-white to-indigo-100 
             dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 
             flex items-center justify-center px-4 py-10">

  <div class="w-full max-w-3xl">

    <div class="backdrop-blur-xl bg-white/80 dark:bg-gray-900/70 
                border border-white/40 dark:border-gray-700 
                shadow-2xl rounded-3xl overflow-hidden">

      <!-- Header -->
      <div class="bg-gradient-to-r from-blue-700 to-indigo-600 p-8 text-white text-center">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">
          Police Incident Report
        </h1>
        <p class="mt-2 text-sm text-blue-100">
          If this is an emergency, please call your local emergency hotline immediately.
        </p>
      </div>

      <!-- Form -->
      <form class="p-8 sm:p-10 space-y-8">

        <!-- Incident Details -->
        <div>
          <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-200 mb-6">
            Incident Details
          </h2>

          <div class="space-y-6">

            <div>
              <label class="block text-sm text-gray-600 dark:text-gray-400">
                Type of Incident
              </label>
              <select required
                class="mt-2 w-full rounded-2xl border border-gray-200 dark:border-gray-700 
                       dark:bg-gray-800 dark:text-white px-4 py-3
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                <option value="">Select Type</option>
                <option>Theft</option>
                <option>Robbery</option>
                <option>Assault</option>
                <option>Domestic Violence</option>
                <option>Vandalism</option>
                <option>Suspicious Activity</option>
                <option>Traffic Incident</option>
                <option>Other</option>
              </select>
            </div>

            <div>
              <label class="block text-sm text-gray-600 dark:text-gray-400">
                Location of Incident
              </label>
              <input type="text" placeholder="Street, Barangay, City"
                required
                class="mt-2 w-full rounded-2xl border border-gray-200 dark:border-gray-700 
                       dark:bg-gray-800 dark:text-white px-4 py-3
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm text-gray-600 dark:text-gray-400">
                  Date
                </label>
                <input type="date" required
                  class="mt-2 w-full rounded-2xl border border-gray-200 dark:border-gray-700 
                         dark:bg-gray-800 dark:text-white px-4 py-3
                         focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
              </div>

              <div>
                <label class="block text-sm text-gray-600 dark:text-gray-400">
                  Time
                </label>
                <input type="time" required
                  class="mt-2 w-full rounded-2xl border border-gray-200 dark:border-gray-700 
                         dark:bg-gray-800 dark:text-white px-4 py-3
                         focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
              </div>
            </div>

            <div>
              <label class="block text-sm text-gray-600 dark:text-gray-400">
                Description of Incident
              </label>
              <textarea rows="4" placeholder="Provide detailed information..."
                required
                class="mt-2 w-full rounded-2xl border border-gray-200 dark:border-gray-700 
                       dark:bg-gray-800 dark:text-white px-4 py-3
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"></textarea>
            </div>

          </div>
        </div>

        <!-- Evidence Upload -->
        <div>
          <label class="block text-sm text-gray-600 dark:text-gray-400">
            Upload Photo / Evidence (Optional)
          </label>
          <input type="file" multiple
            class="mt-2 block w-full text-sm text-gray-600 dark:text-gray-300
                   file:mr-4 file:py-2 file:px-4
                   file:rounded-xl file:border-0
                   file:text-sm file:font-semibold
                   file:bg-blue-50 file:text-blue-700
                   hover:file:bg-blue-100">
        </div>

        <!-- Reporter Info -->
        <div class="border-t pt-6 space-y-6">

          <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-200">
            Your Information
          </h2>

          <div class="flex items-center space-x-3">
            <input type="checkbox" id="anonymous"
              class="rounded text-blue-600 focus:ring-blue-500">
            <label for="anonymous" class="text-sm text-gray-600 dark:text-gray-400">
              Submit Anonymously
            </label>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

            <div>
              <label class="block text-sm text-gray-600 dark:text-gray-400">
                Full Name
              </label>
              <input type="text"
                class="mt-2 w-full rounded-2xl border border-gray-200 dark:border-gray-700 
                       dark:bg-gray-800 dark:text-white px-4 py-3
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            <div>
              <label class="block text-sm text-gray-600 dark:text-gray-400">
                Contact Number or Messenger Account
              </label>
              <input type="text"
                class="mt-2 w-full rounded-2xl border border-gray-200 dark:border-gray-700 
                       dark:bg-gray-800 dark:text-white px-4 py-3
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

          </div>
        </div>

        <!-- Submit -->
        <div class="pt-4">
          <button type="submit"
            class="w-full bg-gradient-to-r from-blue-700 to-indigo-600 
                   hover:opacity-90 text-white font-semibold 
                   py-4 rounded-2xl shadow-lg transition duration-300">
            Submit Report
          </button>
        </div>

      </form>
    </div>

  </div>

</body>
</html>
